<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>try{var l=localStorage.getItem('selectedLanguage')||(navigator.language||'en').split('-')[0];document.documentElement.lang=l}catch(e){}</script>
  <title>SoulTribe.chat — Dashboard</title>
  <link rel="stylesheet" href="/css/index.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1220" />
</head>
<body>
  <div class="page-preloader" id="page-preloader" aria-hidden="true">
    <div class="page-preloader__spinner" role="presentation"></div>
    <span class="page-preloader__text">Loading SoulTribe…</span>
  </div>
  <!-- Navigation will be loaded here by components.js -->
  <div data-component="navbar"></div>
  

  <main class="container" id="main">
    <h1 class="visually-hidden" data-i18n="dashboard.page_heading">Dashboard</h1>
    <section class="card">
        <div class="card-head" style="display:flex; align-items:center; gap:12px;">
          <h2 data-i18n="dashboard.availability">Availability</h2>
        </div>
        <div class="avail-grid">
          <div class="avail-group">
            <input id="availStartDate" type="date" aria-label="Start date" data-i18n-aria-label="dashboard.start_date" />
            <select id="availStartHour" title="Start hour (0–23)" aria-label="Start hour" data-i18n-aria-label="dashboard.start_hour">
            </select>
          </div>
          <div class="avail-group">
            <select id="availDurationHours" data-i18n-title="dashboard.duration_hours" data-i18n-aria-label="dashboard.duration_hours" title="Duration (hours)" aria-label="Duration (hours)">
              <option value="1" data-i18n="dashboard.duration_1h">1 hour</option>
              <option value="2" data-i18n="dashboard.duration_2h">2 hours</option>
              <option value="3" data-i18n="dashboard.duration_3h">3 hours</option>
            </select>
          </div>
        </div>
        <div class="row" style="margin-top:10px;">
          <button id="btn-avail-create" class="primary" data-i18n="dashboard.create_slot">Create Slot</button>
          <a href="https://soultribe.chat/next-steps-guide.html#step-3" class="button secondary" data-i18n="dashboard.slot_help_button">Slot Guide</a>
        </div>
        <div class="row muted">
          <span id="availUtcHint"></span>
        </div>
        <ul id="availList"></ul>
      </section>

    <section class="card">
        <h2 data-i18n="dashboard.meetups">Meetups</h2>
        <div id="meetups" aria-live="polite"></div>
    </section>

    <section class="card">
        <h2 data-i18n="dashboard.matches">Matches</h2>
        <div class="muted" data-i18n="dashboard.active_filter_hint">Only users active in the last 30 days are shown.</div>
        <div class="muted" data-i18n="dashboard.overlap_hint">Click “Propose this time” on an overlap to propose a meetup for that slot.</div>
        <div id="matches"></div>
        <div id="matchesPager" class="pager-controls"></div>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/i18n/i18n.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/dashboard.js"></script>
  <script>
    (function () {
      function hidePreloader() {
        const preloader = document.getElementById('page-preloader');
        if (!preloader) return;
        preloader.classList.add('page-preloader--hide');
        setTimeout(() => {
          if (preloader && preloader.parentNode) {
            preloader.parentNode.removeChild(preloader);
          }
        }, 450);
      }

      if (document.readyState === 'complete') {
        hidePreloader();
      } else {
        window.addEventListener('load', hidePreloader, { once: true });
      }
    })();
    // Redirect back to login if no token
    (function ensureAuth(){
      try {
        const t = localStorage.getItem('access_token');
        if (!t) window.location.href = '/login.html';
      } catch {}
    })();
  </script>
  <!-- Footer will be loaded here by components.js -->
  <div data-component="footer"></div>
</body>
</html>
